<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guide Mallorca — Palma de Mallorca</title>
  <meta name="description" content="En guide till Palma de Mallorca.">
  <meta name="theme-color" content="#000000">
  <link rel="preload" as="image" href="assets/img/palma-oversikt.webp" fetchpriority="high">
  <link rel="preload" as="image" href="assets/img/palma-katedral.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <main>
    <!-- Drönarflygningen: en hög scrollsektion med en fast (sticky) canvas. -->
    <section class="flight" id="flight" aria-label="Flyg in över Palma mot katedralen La Seu">
      <div class="flight__stage">
        <!-- Fallback/förstabild: visas direkt innan canvas har ritat. -->
        <img class="flight__poster" src="assets/img/palma-oversikt.webp" alt="Flygbild över Palma de Mallorca med katedralen La Seu vid vattnet" decoding="async" fetchpriority="high">
        <canvas class="flight__canvas" aria-hidden="true"></canvas>
        <div class="flight__haze" aria-hidden="true"></div>
        <div class="flight__vignette" aria-hidden="true"></div>
        <div class="flight__black" aria-hidden="true"></div>

        <header class="hero">
          <p class="hero__eyebrow">En guide till</p>
          <h1 class="hero__title">Palma <em>de</em> Mallorca</h1>
        </header>

        <div class="scroll-cue" aria-hidden="true">
          <span>Scrolla för att flyga in</span>
          <i></i>
        </div>
      </div>
    </section>

    <!-- Sidan innanför huvudentrén. Svart tills vidare. -->
    <section class="inside" id="inside" aria-label="Innanför katedralen"></section>
  </main>

  <script src="assets/js/flight.js" defer></script>
</body>
</html>
